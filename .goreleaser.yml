version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: nomad-state-metrics
    main: ./cmd/nomad-state-metrics
    binary: nomad-state-metrics
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers:
  - image_templates:
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
  - image_templates:
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-arm64"
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"

docker_manifests:
  - name_template: "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}"
    image_templates:
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-amd64"
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/bhope/nomad-state-metrics:latest"
    image_templates:
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-amd64"
      - "ghcr.io/bhope/nomad-state-metrics:{{ .Tag }}-arm64"
